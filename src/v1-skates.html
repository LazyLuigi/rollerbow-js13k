"use strict";
// =====================================================================
//  ROLLERBOW  -  js13kGames 2026  -  theme: Unicorns and Rainbows
//  Une licorne ragdoll en patins a roulettes devale une piste arc-en-ciel.
//  Modele physique repris d'Action SuperCross / Elasto Mania :
//  3 corps rigides (chassis + 2 patins) relies par des tiges elastiques,

var C = document.getElementById('c'), X = C.getContext('2d'), W, H, DPR, P2 = Path2D;
function resize() {

var CL = [], MTN = [[], []], SKS = [], SPD = [];

    var lay = i % 3; sc = [.55, .85, 1.3][lay] * DPR;

// ---------- CONSTANTES PHYSIQUES (valeurs reprises d'Across) ----------

var DRAG = 1.1, DRAGTUCK = .42;
var OFX = .75, OFY = -.62;                 // patins dans le repere du corps

      land(24, -.6); coins(i - 18, 5, 1.15); if (r() < .4) star(i - 5, .95, 1);

    } else if (f < .74) { stairs(3 + (r() * 3 | 0)); coins(i - 14, 5, 1.25); }

    else if (f < .93) { plunge(); land(12, -.35); coins(i - 9, 5, 1.2); star(i - 3, .95, 1); }

function groundY(x) { var i = x / S | 0; return ys[i] === undefined ? 0 : lerp(ys[i], ys[i + 1] === undefined ? ys[i] : ys[i + 1], x / S - i); }

var _c = [0, 0, 0, 0];

function physTick(t, kL, kR, tuck) {

// ---------- RAGDOLL ----------

  X.fillStyle = hgr; X.fill(); X.strokeStyle = '#e0912c'; X.lineWidth = .022; X.stroke();
  X.strokeStyle = 'rgba(224,145,44,.7)'; X.lineWidth = .026;
  for (i = 1; i < 4; i++) {
    var t = i / 4;
    X.beginPath(); X.moveTo(lerp(.06, .30, t), lerp(.26, .72, t)); X.lineTo(lerp(.24, .30, t), lerp(.21, .72, t)); X.stroke();
  }
  X.save(); X.globalCompositeOperation = 'lighter';
  X.fillStyle = 'rgba(255,228,150,.3)';
  X.beginPath(); X.arc(.30, .70, .2 + sin(AT * 5) * .03, 0, TAU); X.fill(); X.restore();
  X.restore();

  hf(fs, .46, 1); leg(sh[0] - .07, sh[1], HX - .11, HY, 1, 1);

}
function drawTrail() {

  X.save(); X.globalCompositeOperation = 'lighter'; X.lineCap = 'round'; X.lineJoin = 'round';
  var g = X.createLinearGradient(trail[0], trail[1], trail[(n - 1) * 2], trail[(n - 1) * 2 + 1]);
  var h0 = AT * 50 % 360;

  g.addColorStop(.55, 'hsla(' + ((h0 + 110) % 360) + ',100%,70%,.20)');

function drawStars(x0, x1) {
  var i, p, hu, pu;
  X.save(); X.globalCompositeOperation = 'lighter';
  for (i = starIdx; i < stars.length; i++) {
    p = stars[i];

    if (p.t === 1) {                                   // BOOSTER : chevrons qui filent

      var Pb = new P2();
      for (var k = 0; k < 3; k++) {
        var ox = -.34 + k * .3 + ((AT * 2.2 + k * .33) % 1) * .14;
        Pb.moveTo(ox - .16, .34); Pb.lineTo(ox + .13, 0); Pb.lineTo(ox - .16, -.34);
      }
      X.stroke(Pb); X.restore();
    } else if (p.t === 2) {                            // TRAMPOLINE : toile tendue entre deux plots
      pu = p.c ? 0 : .06 + sin(AT * 3 + i) * .05;
      X.strokeStyle = 'rgba(150,255,215,.9)'; X.lineWidth = .1; X.lineCap = 'round';
      X.beginPath(); X.moveTo(p.x - .62, p.y + .1); X.quadraticCurveTo(p.x, p.y - .22 + pu * 3, p.x + .62, p.y + .1); X.stroke();
      X.fillStyle = 'rgba(120,240,200,.22)';

      X.strokeStyle = 'rgba(210,255,240,.75)'; X.lineWidth = .075;
      X.beginPath();
      X.moveTo(p.x - .62, p.y + .1); X.lineTo(p.x - .5, p.y - .34);
      X.moveTo(p.x + .62, p.y + .1); X.lineTo(p.x + .5, p.y - .34);
      X.stroke();
    } else {                                           // PIECE d'or qui tourne
      hu = 45; pu = abs(cos(AT * 3.4 + i * .7));
      X.fillStyle = 'hsla(45,100%,66%,.26)';
      X.beginPath(); X.arc(p.x, p.y, .42, 0, TAU); X.fill();
      X.fillStyle = '#ffc93c';
      X.beginPath(); X.ellipse(p.x, p.y, .045 + .21 * pu, .23, 0, 0, TAU); X.fill();
      if (pu > .35) {

        X.beginPath(); X.ellipse(p.x, p.y, .022 + .12 * pu, .13, 0, 0, TAU); X.fill();

}
function drawFx() {

    p = rings[i];

}

function drawBlood() {                                  // gouttes en vol

    var p = blood[i], st = clamp(hyp(p.vx, p.vy) * .022, 1, 2.6);

// ---------- HUD ----------
function txt(s, x, y, size, col, al, we) {
  X.font = (we || 700) + ' ' + (size * DPR | 0) + 'px "Trebuchet MS",Verdana,sans-serif';
  X.textAlign = al || 'left'; X.fillStyle = col; X.fillText(s, x, y);

  if (!toastQ.length) return;
  var sl = clamp(toastT * 5, 0, 1), a = mn(sl, clamp((TOASTD - toastT) * 3, 0, 1));

var last = 0;
function loop(t) {
  var dt = mn(.033, (t - last) / 1000) || 0; last = t;  // 11 sous-pas max, DT reste <= 3 ms
  if (dt > .002) fps = lerp(fps, 1 / dt, .04);
